apiVersion: ray.io/v1
kind: RayService
metadata:
  name: week2-rayservice
spec:
  serveConfigV2: |
    applications:
      - name: fruit_app
        import_path: fruit.deployment_graph
        route_prefix: /fruit
        runtime_env:
          working_dir: "https://github.com/ray-project/test_dag/archive/78b4a5da38796123d9f9ffff59bab2792a043e95.zip"
        deployments:
          - name: MangoStand
            num_replicas: 1
            user_config:
              price: 3
            ray_actor_options:
              num_cpus: 0.1
          - name: OrangeStand
            num_replicas: 1
            user_config:
              price: 2
            ray_actor_options:
              num_cpus: 0.1
          - name: PearStand
            num_replicas: 1
            user_config:
              price: 1
            ray_actor_options:
              num_cpus: 0.1
          - name: FruitMarket
            num_replicas: 1
            ray_actor_options:
              num_cpus: 0.1
      - name: math_app
        import_path: conditional_dag.serve_dag
        route_prefix: /calc
        runtime_env:
          working_dir: "https://github.com/ray-project/test_dag/archive/78b4a5da38796123d9f9ffff59bab2792a043e95.zip"
        deployments:
          - name: Adder
            num_replicas: 1
            user_config:
              increment: 3
            ray_actor_options:
              num_cpus: 0.1
          - name: Multiplier
            num_replicas: 1
            user_config:
              factor: 5
            ray_actor_options:
              num_cpus: 0.1
          - name: Router
            num_replicas: 1
  rayClusterConfig:
    rayVersion: "2.52.0"
    headGroupSpec:
      # Serve replica가 없는 worker는 의도적으로 Ready가 되지 않는다.
      # 모든 Serve replica를 worker에 배치해 worker 복구를 검증한다.
      rayStartParams:
        num-cpus: "0"
      template:
        spec:
          terminationGracePeriodSeconds: 10
          containers:
            - name: ray-head
              image: rayproject/ray:2.52.0
              env:
                - name: WEEK2_REVISION
                  value: v1
              resources:
                requests:
                  cpu: "1"
                  memory: 2Gi
                limits:
                  cpu: "2"
                  memory: 4Gi
    workerGroupSpecs:
      - groupName: cpu-small
        replicas: 1
        minReplicas: 1
        maxReplicas: 1
        rayStartParams: {}
        template:
          spec:
            terminationGracePeriodSeconds: 10
            containers:
              - name: ray-worker
                image: rayproject/ray:2.52.0
                env:
                  - name: WEEK2_REVISION
                    value: v1
                resources:
                  requests:
                    cpu: 500m
                    memory: 1Gi
                  limits:
                    cpu: "1"
                    memory: 2Gi
